version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nextjs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_DB: app_db
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-web
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      # 确保 Node 在容器内按生产模式运行
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nextjs-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置文件（后续会在项目中新增 nginx/default.conf）
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 宿主机上由 Certbot 生成的证书目录
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


