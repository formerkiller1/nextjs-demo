cat /srv/nextjs-app/nginx/default.conf
server {
  listen 80;
  server_name dctcoder.top;

  # Webhook 走 HTTP，不跳转 HTTPS
  location /webhook {
    proxy_pass http://172.19.0.1:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 其他 HTTP 请求统一跳转到 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name dctcoder.top;

  # Let's Encrypt 证书路径（来自宿主机 /etc/letsencrypt 挂载）
  ssl_certificate     /etc/letsencrypt/live/dctcoder.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dctcoder.top/privkey.pem;

  # SSL 配置（兼容移动设备，特别是 iOS Safari）
  ssl_protocols TLSv1.2 TLSv1.3;
  # 使用更兼容的密码套件（iOS Safari 支持）
  ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:!aNULL:!MD5:!DSS';
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  # 启用 session tickets（某些移动浏览器需要）
  ssl_session_tickets on;

  # 基本安全头
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # 移动设备优化
  client_max_body_size 10M;
  client_body_timeout 60s;
  client_header_timeout 60s;

  location /webhook {
    proxy_pass http://172.19.0.1:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://web:3000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 超时设置（移动网络可能需要更长时间）
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 缓冲设置
    proxy_buffering off;
    proxy_request_buffering off;
  }
}